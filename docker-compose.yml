services:
  squidc5:
    build: .
    image: squidc5:latest
    container_name: squidc5
    restart: unless-stopped
    # Host networking so reverse-shell / TCP listeners can bind any host port
    # (bridge mode only publishes ports listed under `ports:`).
    network_mode: host
    environment:
      SQUIDC5_HOST: "0.0.0.0"
      SQUIDC5_PORT: "8443"
      SQUIDC5_DATA_DIR: "/data"
      # Secure-by-default: MCP off until explicitly needed
      SQUIDC5_MCP_ENABLED: "false"
      SQUIDC5_AI_ENABLED: "true"
      SQUIDC5_SHELL_AUTO_STABILIZE: "true"
      SQUIDC5_EXPOSE_HEALTH_DETAILS: "false"
      SQUIDC5_SECURITY_HEADERS: "true"
      # Stage-2 reconnect callback host (droplet public IP)
      SQUIDC5_PUBLIC_HOST: "159.203.99.184"
      # CORS empty by default — /ops is same-origin
    volumes:
      - squidc5-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

volumes:
  squidc5-data:
