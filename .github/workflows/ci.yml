name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q --cov=squidc5 --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t squidc5:ci .
      - name: Run container smoke test
        run: |
          docker run -d --name squidc5-ci -p 8443:8443 squidc5:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8443/api/v1/health; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs squidc5-ci
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f squidc5-ci || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt || true

  # Standalone operator CLI + server binaries (no venv required).
  # Runs on pushes to main/master after tests pass.
  binaries:
    name: binaries (${{ matrix.os }})
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install "pyinstaller>=6.3"

      - name: Build binaries
        run: python packaging/build_binaries.py

      - name: Smoke-test CLI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./dist/binaries/sc5.exe --help
            ./dist/binaries/sc5.exe --url http://127.0.0.1:9 health || true
          else
            ./dist/binaries/sc5 --help
            ./dist/binaries/sc5 --url http://127.0.0.1:9 health || true
          fi

      - name: Smoke-test server (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          ./dist/binaries/squidc5 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8443/api/v1/health; then
              echo
              curl -sf http://127.0.0.1:8443/ops | head -c 200
              echo
              exit 0
            fi
            sleep 1
          done
          echo "server failed to become healthy"
          exit 1

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: squidc5-${{ matrix.artifact }}
          path: |
            dist/binaries/sc5
            dist/binaries/sc5.exe
            dist/binaries/squidc5
            dist/binaries/squidc5.exe
            dist/binaries/README.txt
            dist/binaries/*/
          if-no-files-found: error
          retention-days: 30
